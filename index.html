<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shoe Closet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Shoe Closet</h1>
    <p>Shoes currently available</p>
  </header>

  <main>
    <!-- Shoe cards are added here by script.js -->
    <div id="grid" class="grid"></div>
  </main>

  <!-- Detail panel: hidden until a card is clicked -->
  <div id="overlay" class="overlay" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="d-name">
      <button id="close" class="close" aria-label="Close">&times;</button>
      <div id="d-photo" class="photo big"></div>
      <h2 id="d-name"></h2>
      <p id="d-price" class="price"></p>
      <dl id="d-info"></dl>
      <p id="d-desc"></p>
    </div>
  </div>

  <script src="shoes.js"></script>
  <script src="script.js"></script>
</body>
</html>
